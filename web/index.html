<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 陪伴 · 玩具控制</title>
<style>
  :root {
    --bg: #1a1423; --card: #2a2140; --text: #f0eaff; --dim: #9a8fb8;
    --accent: #e8608c; --accent2: #8c5ce8; --danger: #ff4d5e; --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid rgba(255,255,255,.06); }
  header .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header h1 { font-size: 17px; }
  header .status { font-size: 12px; color: var(--dim); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; margin-right: 4px; }
  #dot.on { background: var(--ok); }
  #dot.off { background: var(--danger); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; word-break: break-word; animation: pop .18s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
  .msg.cmd { align-self: center; background: transparent; color: var(--dim); font-size: 12px; padding: 2px 8px; }
  .msg.cmd b { color: var(--accent2); }
  .msg.sys { align-self: center; background: rgba(255,77,94,.12); color: #ffb3ba; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .msg .tools { display: flex; gap: 6px; margin-top: 8px; }
  .msg .tools button, #btn-tts { background: rgba(255,255,255,.1); border: none; color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #inputbar { display: flex; gap: 10px; padding: 12px 16px; background: var(--card); border-top: 1px solid rgba(255,255,255,.06); }
  #input { flex: 1; background: var(--bg); border: 1px solid rgba(255,255,255,.12); color: var(--text); border-radius: 24px; padding: 12px 16px; font-size: 15px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; border-radius: 50%; width: 46px; height: 46px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #stop { position: fixed; right: 14px; bottom: 92px; width: 54px; height: 54px; border-radius: 50%; border: none; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(255,77,94,.4); z-index: 10; }
  #btn-persona, #btn-memory, #btn-voice { background: rgba(255,255,255,.08); border: none; border-radius: 12px; padding: 8px 10px; font-size: 16px; cursor: pointer; }
  #scene-select { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: var(--text); border-radius: 10px; padding: 6px 8px; font-size: 12px; cursor: pointer; max-width: 120px; }
  #scene-select option { background: var(--card); color: var(--text); }
  #persona-menu, #memory-menu, #voice-menu { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 20; align-items: center; justify-content: center; }
  #persona-menu.show, #memory-menu.show, #voice-menu.show { display: flex; }
  #persona-menu .panel, #memory-menu .panel, #voice-menu .panel { background: var(--card); border-radius: 16px; padding: 18px; width: min(90vw, 380px); max-height: 70vh; overflow-y: auto; }
  #persona-menu h3, #memory-menu h3, #voice-menu h3 { margin-bottom: 12px; font-size: 15px; color: var(--dim); }
  .m-item { padding: 9px 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,.06); display: flex; gap: 8px; align-items: flex-start; }
  .m-item .m-text { flex: 1; font-size: 13px; line-height: 1.5; }
  .m-item .m-del { background: none; border: none; color: var(--danger); font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .m-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 0; }
  .m-clear { margin-top: 10px; width: 100%; background: rgba(255,77,94,.15); border: 1px solid rgba(255,77,94,.4); color: #ffb3ba; border-radius: 10px; padding: 9px; cursor: pointer; font-size: 13px; }
  .p-import { margin-top: 10px; width: 100%; background: rgba(255,255,255,.06); border: 1px dashed rgba(255,255,255,.25); color: var(--dim); border-radius: 10px; padding: 9px; cursor: pointer; font-size: 13px; }
  .p-import:hover { color: var(--text); border-color: var(--accent); }
  .m-add { display: flex; gap: 8px; margin-bottom: 12px; }
  .m-add input { flex: 1; background: var(--bg); border: 1px solid rgba(255,255,255,.12); color: var(--text); border-radius: 10px; padding: 9px 12px; font-size: 13px; outline: none; }
  .m-add input:focus { border-color: var(--accent); }
  .m-add button { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; border-radius: 10px; padding: 0 14px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .m-imp { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--dim); }
  .m-imp .stars { display: flex; gap: 2px; }
  .m-imp .stars span { cursor: pointer; font-size: 15px; opacity: .3; }
  .m-imp .stars span.on { opacity: 1; color: #ffd166; }
  #btn-mic { background: var(--card); border: 1px solid rgba(255,255,255,.12); border-radius: 50%; width: 46px; height: 46px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #btn-mic.rec { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  #persona-menu, #voice-menu { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 20; align-items: center; justify-content: center; }
  #persona-menu.show, #voice-menu.show { display: flex; }
  #persona-menu .panel, #voice-menu .panel { background: var(--card); border-radius: 16px; padding: 18px; width: min(90vw, 380px); max-height: 70vh; overflow-y: auto; }
  #persona-menu h3, #voice-menu h3 { margin-bottom: 12px; font-size: 15px; color: var(--dim); }
  #persona-menu .p-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; border: 1px solid rgba(255,255,255,.06); }
  #persona-menu .p-item:hover { background: rgba(255,255,255,.06); }
  #persona-menu .p-item.active { border-color: var(--accent); }
  #persona-menu .p-item b { display: block; font-size: 15px; margin-bottom: 2px; }
  #persona-menu .p-item span { font-size: 12px; color: var(--dim); }
  .typing::after { content: "▌"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (min-width: 720px) { body { max-width: 720px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,.5); } }
</style>
</head>
<body>
<header>
  <div class="avatar" id="avatar" title="点击切换角色">🌸</div>
  <div style="flex:1; cursor:pointer" onclick="switchPersona()">
    <h1 id="name">AI 陪伴</h1>
    <div class="status"><span id="dot"></span><span id="toy-status">连接中…</span></div>
  </div>
  <button id="btn-persona" onclick="switchPersona()" title="切换角色">🎭</button>
  <button id="btn-voice" onclick="switchVoice()" title="切换克隆音色">🗣</button>
  <button id="btn-memory" onclick="toggleMemory()" title="记忆管理">🧠</button>
  <select id="scene-select" title="剧情选择（scenes/ 目录音频）" onchange="selectScene(this)"><option value="">🎬 剧情</option></select>
</header>

<div id="messages">
  <div class="msg sys">欢迎回来～ 我是你的 AI 陪伴。开始聊天吧（安全词: red，紧急停止按钮在右下角）</div>
</div>

<div id="inputbar">
  <button id="btn-mic" title="语音输入">🎤</button>
  <input id="input" placeholder="说点什么…" autocomplete="off">
  <button id="send">➤</button>
</div>
<button id="stop" title="紧急停止">STOP</button>
<div id="persona-menu" onclick="if(event.target===this)hideMenu()">
  <div class="panel">
    <h3>选择角色</h3>
    <div id="persona-list"></div>
    <button class="p-import" onclick="importPersona()" title="导入 SillyTavern 角色卡（Character Card V2 JSON）">＋ 导入角色卡</button>
    <input type="file" id="file-import" accept=".json,application/json" style="display:none" onchange="importPersonaFile(this)">
  </div>
</div>
<div id="voice-menu" onclick="if(event.target===this)hideVoiceMenu()">
  <div class="panel">
    <h3>🎙 克隆音色</h3>
    <div id="voice-list"></div>
    <div class="m-empty">把参考音频 <b>&lt;音色名&gt;.wav</b> + <b>&lt;音色名&gt;.txt</b> 放入项目 <b>voices/</b> 目录即自动出现在这里</div>
  </div>
</div>
<div id="memory-menu" onclick="if(event.target===this)hideMemory()">
  <div class="panel">
    <h3>🧠 记忆管理（<span id="mem-count">0</span> 条）</h3>
    <div class="m-add">
      <input id="mem-input" placeholder="添加一条记忆…" maxlength="200">
      <button onclick="addMemory()" title="添加">＋</button>
    </div>
    <div class="m-imp">重要度
      <span class="stars" id="mem-stars">
        <span onclick="setImportance(1)">★</span><span onclick="setImportance(2)">★</span><span onclick="setImportance(3)">★</span><span onclick="setImportance(4)">★</span><span onclick="setImportance(5)">★</span>
      </span>
      <span id="mem-imp-label">普通</span>
    </div>
    <div id="memory-list"></div>
    <button class="m-clear" onclick="clearMemories()">清空全部记忆</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const sessionId = sessionStorage.getItem('session') || (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '');
sessionStorage.setItem('session', sessionId);
let aiEl = null, aiFull = '', queue = [];
let devices = [], personas = [], personaFile = '';
const emojis = ['🌸','🦊','🌙','💎','🔥','🍑','✨','🌊'];

async function boot() {
  try {
    const r = await fetch('/api/info');
    const info = await r.json();
    $('#name').textContent = info.persona;
    devices = info.devices;
    personaFile = info.persona_file;
    updateToy(info);
    const r2 = await fetch('/api/personas');
    const pl = await r2.json();
    personas = pl.personas;
    renderPersonas();
    await loadVoices();
    renderVoices();
    await loadScenes();
  } catch (e) { $('#toy-status').textContent = '服务器不可用'; }
}
function renderPersonas() {
  const list = $('#persona-list');
  list.innerHTML = '';
  personas.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'p-item' + (p.file === personaFile ? ' active' : '');
    d.innerHTML = `<b>${emojis[i % emojis.length]} ${p.name}</b><span>${p.desc || ''}</span>`;
    d.onclick = async () => {
      const r = await fetch('/api/persona', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: p.file }) });
      if (r.ok) {
        const j = await r.json();
        $('#name').textContent = j.name;
        personaFile = j.file;
        hideMenu();
        sessionStorage.removeItem('session');
        location.reload();
      }
    };
    list.appendChild(d);
  });
}
function switchPersona() { if (personas.length) $('#persona-menu').classList.add('show'); }
function hideMenu() { $('#persona-menu').classList.remove('show'); }

// ---- 克隆音色（GPT-SoVITS，voices/ 目录）----
let voices = [], currentVoice = '';
async function loadVoices() {
  try {
    const r = await fetch('/api/tts/voices');
    const j = await r.json();
    voices = j.voices; currentVoice = j.current;
  } catch (e) { voices = []; }
}
function switchVoice() { if (voices.length) $('#voice-menu').classList.add('show'); }
function hideVoiceMenu() { $('#voice-menu').classList.remove('show'); }
function renderVoices() {
  const list = $('#voice-list');
  list.innerHTML = '';
  voices.forEach(v => {
    const d = document.createElement('div');
    d.className = 'p-item' + (v.name === currentVoice ? ' active' : '');
    d.innerHTML = `<b>🗣 ${v.name}</b><span>${v.prompt || ''}</span>`;
    d.onclick = async () => {
      const r = await fetch('/api/tts/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: v.name }) });
      if (r.ok) { currentVoice = v.name; renderVoices(); hideVoiceMenu(); }
    };
    list.appendChild(d);
  });
}
async function speakAI(btn) {
  const text = btn.dataset.text || '';
  if (!text || btn.disabled) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) { alert('TTS 合成失败'); btn.disabled = false; return; }
    const url = URL.createObjectURL(await r.blob());
    const audio = new Audio(url);
    audio.onended = () => { btn.disabled = false; URL.revokeObjectURL(url); };
    audio.onerror = () => { btn.disabled = false; URL.revokeObjectURL(url); alert('音频播放失败'); };
    audio.play();
  } catch (e) { btn.disabled = false; alert('TTS 失败: ' + e.message); }
}

// ---- 角色卡导入（SillyTavern Character Card V2）----
function importPersona() { $('#file-import').click(); }
async function importPersonaFile(inp) {
  const f = inp.files[0];
  if (!f) return;
  let text;
  try { text = await f.text(); } catch (e) { alert('读取文件失败'); inp.value = ''; return; }
  const r = await fetch('/api/personas/import', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: text
  });
  if (!r.ok) {
    let msg = '导入失败';
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    alert(msg);
    inp.value = '';
    return;
  }
  const j = await r.json();
  // 自动切换到新导入的角色
  const r2 = await fetch('/api/persona', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: j.file }) });
  if (r2.ok) {
    const j2 = await r2.json();
    $('#name').textContent = j2.name;
    personaFile = j2.file;
    hideMenu();
    sessionStorage.removeItem('session');
    location.reload();
  }
  inp.value = '';
}

// ---- 剧情选择（scenes/ 目录音频 → 转写 → 注入对话）----
async function loadScenes() {
  try {
    const r = await fetch('/api/scenes');
    const j = await r.json();
    const sel = $('#scene-select');
    sel.innerHTML = '<option value="">🎬 剧情</option>';
    j.scenes.forEach(s => {
      const o = document.createElement('option');
      o.value = s.name;
      o.textContent = (s.transcribed ? '✅ ' : '⏳ ') + s.name;
      sel.appendChild(o);
    });
    if (j.active) sel.value = j.active;
  } catch (e) { /* 无剧情目录时静默 */ }
}
let scenePoll = null;
async function selectScene(sel) {
  const name = sel.value;
  const r = await fetch('/api/scenes/select', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
  });
  if (!r.ok) { alert('剧情选择失败'); return; }
  if (!name) { addMsg('🎬 剧情已清除', 'sys'); return; }
  addMsg('🎬 剧情已选择：' + name + '（转写中…完成后自动生效）', 'sys');
  if (scenePoll) clearInterval(scenePoll);
  scenePoll = setInterval(async () => {
    try {
      const s = await (await fetch('/api/scenes/status')).json();
      if (s.status === 'done') {
        clearInterval(scenePoll); scenePoll = null;
        addMsg('✅ 剧情已加载（' + s.text_len + ' 字），开始按剧本互动', 'sys');
      } else if (s.status === 'error') {
        clearInterval(scenePoll); scenePoll = null;
        addMsg('⚠ 剧情转写失败', 'sys');
      }
    } catch (e) { clearInterval(scenePoll); scenePoll = null; }
  }, 5000);
}

// ---- 记忆管理 ----
const IMP_LABELS = ['', '次要', '一般', '普通', '重要', '非常重要'];
let memImportance = 3;
function toggleMemory() { loadMemories(); renderStars(); $('#memory-menu').classList.add('show'); }
function hideMemory() { $('#memory-menu').classList.remove('show'); }
function renderStars() {
  document.querySelectorAll('#mem-stars span').forEach((s, i) => s.classList.toggle('on', i < memImportance));
  $('#mem-imp-label').textContent = IMP_LABELS[memImportance];
}
function setImportance(n) { memImportance = n; renderStars(); }
async function addMemory() {
  const input = $('#mem-input');
  const text = input.value.trim();
  if (!text) return;
  try {
    const r = await fetch('/api/memory/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, importance: memImportance }) });
    const j = await r.json();
    if (!j.ok) { addMsg('⚠ ' + (j.error || '添加失败'), 'sys'); return; }
    if (j.added) { input.value = ''; loadMemories(); }
    else { addMsg('⚠ 该记忆与已有记忆相似，已合并并更新重要度', 'sys'); input.value = ''; loadMemories(); }
  } catch (e) { addMsg('⚠ 添加失败: ' + e.message, 'sys'); }
}
async function loadMemories() {
  const list = $('#memory-list');
  list.innerHTML = '<div class="m-empty">加载中…</div>';
  try {
    const r = await fetch('/api/memory');
    const j = await r.json();
    $('#mem-count').textContent = j.memories.length;
    if (!j.memories.length) { list.innerHTML = '<div class="m-empty">还没有记忆～ 聊天中我会自动记住重要的事</div>'; return; }
    list.innerHTML = '';
    j.memories.forEach((m, i) => {
      const d = document.createElement('div');
      d.className = 'm-item';
      d.innerHTML = `<div class="m-text">${'★'.repeat(m.importance || 1)} ${m.text}</div>
        <button class="m-del" title="删除这条记忆">✕</button>`;
      d.querySelector('.m-del').onclick = async () => {
        await fetch('/api/memory/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ index: i }) });
        loadMemories();
      };
      list.appendChild(d);
    });
  } catch (e) { list.innerHTML = '<div class="m-empty">加载失败: ' + e.message + '</div>'; }
}
async function clearMemories() {
  if (!confirm('确定清空当前角色的全部记忆吗？此操作不可恢复。')) return;
  await fetch('/api/memory/clear', { method: 'POST' });
  loadMemories();
}
function updateToy(info) {
  const dot = $('#dot');
  if (info.toy === 'connected') { dot.className = 'on'; $('#toy-status').textContent = '玩具已连接 · ' + devices.map(d => d.DeviceName).join('、') || '已连接，无设备'; }
  else { dot.className = 'off'; $('#toy-status').textContent = '日志模式（未连接 Intiface）'; }
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
  return div;
}
function addCmd(c) {
  const txt = c.kind === 'vibrate' ? `⚡ 振动 马达${c.index} @ ${c.intensity}%`
           : c.kind === 'stop' ? '⏹ 已停止'
           : `🎵 模式「${c.name}」${c.index ? ' @ ' + c.index + '%' : ''}${c.duration ? ' · ' + c.duration + 's' : ''}`;
  const div = document.createElement('div');
  div.className = 'msg cmd';
  div.innerHTML = txt;
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

async function send() {
  const text = $('#input').value.trim();
  if (!text || $('#send').disabled) return;
  $('#input').value = '';
  addMsg(text, 'user');
  const ai = addMsg('', 'ai');
  ai.classList.add('typing');
  aiEl = ai; aiFull = '';

  $('#send').disabled = true;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        const ev = p.match(/^event: (\w+)/m)?.[1];
        const data = p.match(/^data: (.*)$/m)?.[1];
        if (!ev || !data) continue;
        if (ev === 'delta') { aiFull += JSON.parse(data); aiEl.textContent = aiFull; aiEl.classList.remove('typing'); }
        else if (ev === 'cmd') addCmd(JSON.parse(data));
        else if (ev === 'error') addMsg('⚠ ' + JSON.parse(data), 'sys');
      }
      $('#messages').scrollTop = $('#messages').scrollHeight;
    }
    if (!aiFull) aiEl.textContent = '(无回复)';
    if (aiFull) {
      const tools = document.createElement('div');
      tools.className = 'tools';
      const btn = document.createElement('button');
      btn.id = 'btn-tts';
      btn.textContent = '🔊 朗读';
      btn.dataset.text = aiFull;
      btn.onclick = () => speakAI(btn);
      tools.appendChild(btn);
      aiEl.appendChild(tools);
    }
  } catch (e) { addMsg('⚠ 请求失败: ' + e.message, 'sys'); }
  $('#send').disabled = false;
}

$('#send').onclick = send;
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#stop').onclick = async () => {
  addMsg('（紧急停止已触发）', 'sys');
  await fetch('/api/emergency_stop', { method: 'POST' });
};

// ---- 语音输入（MediaRecorder → /api/stt）----
let recorder = null, chunks = [];
const micBtn = $('#btn-mic');
micBtn.onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      micBtn.classList.remove('rec');
      micBtn.textContent = '🎤';
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      micBtn.disabled = true; micBtn.textContent = '…';
      try {
        const r = await fetch('/api/stt', { method: 'POST', body: blob });
        const j = await r.json();
        if (j.text) { $('#input').value = ($('#input').value ? $('#input').value + ' ' : '') + j.text; $('#input').focus(); }
        else addMsg('⚠ 未识别到语音', 'sys');
      } catch (e) { addMsg('⚠ 语音识别失败: ' + e.message, 'sys'); }
      micBtn.disabled = false; micBtn.textContent = '🎤';
      recorder = null;
    };
    recorder.start();
    micBtn.classList.add('rec');
    micBtn.textContent = '⏹';
  } catch (e) { addMsg('⚠ 无法使用麦克风: ' + e.message, 'sys'); }
};

boot();
</script>
</body>
</html>
